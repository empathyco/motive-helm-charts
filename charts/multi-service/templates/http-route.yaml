{{- $api := "gateway.networking.k8s.io/v1" -}}
{{- if and .Values.httpRoute.enabled (.Capabilities.APIVersions.Has $api) -}}
# NOTE: with canary rollouts using trafficRouting.gatewayAPI, httpRoute.spec must
# include both the stable and the canary services as weighted backendRefs in the
# same rule so the argoproj-labs/gatewayAPI plugin can shift traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "multi-service.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.httpRoute.namespace }}
  {{- with .Values.httpRoute.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml (required "httpRoute.spec is required" .Values.httpRoute.spec) | nindent 2 }}
{{- end -}}

